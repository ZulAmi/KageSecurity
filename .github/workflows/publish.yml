name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # Nothing is published unless the full CI suite passes on the tagged commit.
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Docker image (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  publish-helm:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Log in to GHCR for Helm
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push Helm chart (version = git tag)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          helm package helm/kagesec --version "$VERSION" --app-version "$VERSION"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push "kagesec-${VERSION}.tgz" "oci://ghcr.io/${OWNER}"

  # One platform wheel per target, each bundling the matching Go engine binary.
  build-wheel:
    name: Wheel (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            bin_name: kagesec-engine
            plat_tag: manylinux_2_17_x86_64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            bin_name: kagesec-engine
            plat_tag: manylinux_2_17_aarch64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            bin_name: kagesec-engine
            plat_tag: macosx_11_0_arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            bin_name: kagesec-engine
            plat_tag: macosx_10_15_x86_64
          - os: windows-latest
            goos: windows
            goarch: amd64
            bin_name: kagesec-engine.exe
            plat_tag: win_amd64

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Build Go engine
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: cd engine && go build -trimpath -ldflags="-s -w" -o ../scanner/_bin/${{ matrix.bin_name }} .

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and retag wheel
        shell: bash
        run: |
          pip install build "wheel>=0.40"
          python -m build --wheel
          wheel tags --platform-tag ${{ matrix.plat_tag }} --remove dist/kagesec-*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.whl

  # Source distribution: installs anywhere; without the Go engine the Python
  # template runner is used instead.
  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheel, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      id-token: write   # trusted publishing; also produces PEP 740 attestations

    steps:
      # Download the distributions by name. The run also contains Docker build
      # records (*.dockerbuild, uploaded unzipped by docker/build-push-action),
      # which download-artifact cannot extract.
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: List distributions
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi, build-and-push]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Download the distributions by name. The run also contains Docker build
      # records (*.dockerbuild, uploaded unzipped by docker/build-push-action),
      # which download-artifact cannot extract.
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag

name: Integration (vulnerable targets)

# Scans intentionally vulnerable apps (DVWA, Juice Shop) and a clean nginx target to
# catch detection regressions: true positives that stop firing, or false positives
# that start appearing on a clean site. Runs nightly and on demand — not on every PR,
# because it takes several minutes.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install KageSec
        run: pip install -e ".[dev]"

      - name: Start targets
        run: docker compose -f tests/integration/docker-compose.yml up -d --wait dvwa dvwa-db juice-shop clean-nginx

      - name: Initialise DVWA database
        run: |
          curl -fsS -c /tmp/dvwa -b /tmp/dvwa http://localhost:4280/setup.php -o /tmp/setup.html
          token=$(grep -oP "user_token' value='\K[^']+" /tmp/setup.html || true)
          curl -fsS -c /tmp/dvwa -b /tmp/dvwa -X POST http://localhost:4280/setup.php \
            --data-urlencode "create_db=Create / Reset Database" --data-urlencode "user_token=${token}" -o /dev/null

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -p no:cacheprovider

      - name: Target logs on failure
        if: failure()
        run: docker compose -f tests/integration/docker-compose.yml logs --tail=100

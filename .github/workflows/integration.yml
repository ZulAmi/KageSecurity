name: Integration (vulnerable targets)

# Scans intentionally vulnerable apps (DVWA, Juice Shop) and a clean nginx target to
# catch detection regressions: true positives that stop firing, or false positives
# that start appearing on a clean site. Runs nightly and on demand — not on every PR,
# because it takes several minutes.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install KageSec (with the browser crawler, needed for Juice Shop)
        run: |
          pip install -e ".[dev,browser]"
          python -m playwright install --with-deps chromium

      - name: Start targets
        run: docker compose -f tests/integration/docker-compose.yml up -d --wait dvwa dvwa-db juice-shop clean-nginx

      - name: Wait until every target answers HTTP
        run: |
          for url in http://localhost:4280/login.php http://localhost:3000/ http://localhost:8888/; do
            for i in $(seq 1 60); do
              curl -fsS -o /dev/null "$url" && { echo "ready: $url"; continue 2; }
              sleep 3
            done
            echo "::error::$url did not become ready"; exit 1
          done

      - name: Debug DVWA SQLi (temporary)
        run: |
          python - <<'PYEOF'
          import re, sys, httpx
          sys.path.insert(0, "tests/integration")
          from test_dvwa import _dvwa_session, DVWA_URL
          from scanner.core.config import ScanConfig
          from scanner.core.crawler import Crawler
          from scanner.modules import sqli
          sid = _dvwa_session()
          cookies = {"PHPSESSID": sid, "security": "low"}
          c = httpx.Client(follow_redirects=True, headers={"Cookie": f"PHPSESSID={sid}; security=low"})
          url = DVWA_URL + "/vulnerabilities/sqli/"
          for p in ["1", "1'", "1' OR '1'='1"]:
              r = c.get(url, params={"id": p, "Submit": "Submit"})
              pre = [re.sub(r"<[^>]+>", " ", x)[:120] for x in re.findall(r"<pre>(.*?)</pre>", r.text, re.S)]
              print("PROBE", repr(p), r.status_code, len(r.text), pre[:3], r.text[:150].replace("\n", " ") if r.status_code >= 500 else "")
          cfg = ScanConfig(target=DVWA_URL, max_depth=1, exclude_patterns=["*logout*", "*setup.php*", "*security.php*"],
                           auth={"type": "cookie", "cookies": cookies})
          crawler = Crawler(DVWA_URL, max_depth=1, config=cfg)
          pages = []
          crawler._crawl_page(url, depth=1, results=pages)
          page = pages[0]
          print("PAGE", page.url, page.status_code, "forms:", page.forms)
          found = sqli.test(page, c, config=cfg)
          print("FINDINGS", [(f.title, f.url, f.parameter) for f in found])
          PYEOF

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -p no:cacheprovider

      - name: Target logs on failure
        if: failure()
        run: docker compose -f tests/integration/docker-compose.yml logs --tail=100

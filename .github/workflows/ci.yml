name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        # Coverage floor (measured at 29%): raise it as tests are added, never lower it.
        run: pytest tests/unit/ --cov=scanner --cov=cli --cov-report=term --cov-fail-under=28

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # ruff comes from the dev extra so CI and local runs use the same pinned range
      - name: Install dev tools
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check scanner/ cli/ tests/unit/ examples/

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install "bandit>=1.7"

      - name: Run Bandit security scan
        # -ll = medium severity and above; templates are YAML attack payloads, not code
        run: bandit -r scanner/ cli/ -ll -x scanner/templates/

  deps:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip wheel
          pip install -e ".[all,dev]"

      - name: Audit for known vulnerabilities
        run: pip-audit

  engine:
    name: Go engine (vet, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -o /dev/null .

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint helm/kagesec
      - run: helm template ci helm/kagesec --set reports.enabled=true --set anthropicApiKey=x > /dev/null

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # amd64 only and never pushed — catches Dockerfile breakage before a release does
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: kagesec:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm kagesec:ci --help > /dev/null
          test "$(docker run --rm --entrypoint id kagesec:ci -u)" = "10001"
          docker run --rm --entrypoint python kagesec:ci -c "
          import os, scanner
          engine = os.path.join(os.path.dirname(scanner.__file__), '_bin', 'kagesec-engine')
          assert os.access(engine, os.X_OK), f'engine missing or not executable: {engine}'
          print('engine ok:', engine)
          "

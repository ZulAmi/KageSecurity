image:
  repository: ghcr.io/zulami/kagesecurity
  tag: ""                 # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

scan:
  target: "https://example.com"   # only scan systems you are authorised to test
  depth: 3
  maxPages: 50
  output: sarif
  failOn: high
  passive: false
  noAi: false
  concurrency: 8
  rateLimit: 10
  modules: []         # empty = all modules
  exclude: []         # URL glob patterns to skip
  compliance: []      # iso27001 hipaa gdpr appi

# Secrets. Values set here are stored in a Kubernetes Secret created by the chart and
# passed to the scanner as environment variables (never as command-line arguments).
# To manage the Secret yourself, set existingSecret to its name; it may contain any of
# the keys ANTHROPIC_API_KEY, NVD_API_KEY, KAGESEC_AUTH_BEARER, KAGESEC_AUTH_COOKIE.
existingSecret: ""
anthropicApiKey: ""
nvdApiKey: ""
auth:
  bearer: ""
  cookie: ""          # NAME=VALUE

proxy: ""

# Store reports in a PVC mounted at mountPath. When disabled, reports go to an
# emptyDir and are lost when the pod is removed.
reports:
  enabled: false
  storageClass: ""
  size: 1Gi
  mountPath: /reports

job:
  restartPolicy: Never
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: ""

{{- if and (not .Values.existingSecret) (or .Values.anthropicApiKey .Values.nvdApiKey .Values.auth.bearer .Values.auth.cookie) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kagesec.fullname" . }}
  labels:
    {{- include "kagesec.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.nvdApiKey }}
  NVD_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.bearer }}
  KAGESEC_AUTH_BEARER: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.cookie }}
  KAGESEC_AUTH_COOKIE: {{ . | quote }}
  {{- end }}
{{- end }}

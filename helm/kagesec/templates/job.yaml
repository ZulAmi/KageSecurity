{{- $secret := include "kagesec.secretName" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kagesec.fullname" . }}
  labels:
    {{- include "kagesec.labels" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.job.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "kagesec.labels" . | nindent 8 }}
    spec:
      restartPolicy: {{ .Values.job.restartPolicy }}
      automountServiceAccountToken: false
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "kagesec.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kagesec
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - scan
            - --depth
            - {{ .Values.scan.depth | quote }}
            - --max-pages
            - {{ .Values.scan.maxPages | quote }}
            - --output
            - {{ .Values.scan.output | quote }}
            - --report-dir
            - {{ .Values.reports.mountPath | quote }}
            {{- with .Values.scan.failOn }}
            - --fail-on
            - {{ . | quote }}
            {{- end }}
            - --concurrency
            - {{ .Values.scan.concurrency | quote }}
            - --rate-limit
            - {{ .Values.scan.rateLimit | quote }}
            {{- if .Values.scan.passive }}
            - --passive
            {{- end }}
            {{- if .Values.scan.noAi }}
            - --no-ai
            {{- end }}
            {{- if .Values.scan.modules }}
            - --modules
            {{- range .Values.scan.modules }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.scan.exclude }}
            - --exclude
            {{- range .Values.scan.exclude }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.scan.compliance }}
            - --compliance
            {{- range .Values.scan.compliance }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.proxy }}
            - --proxy
            - {{ .Values.proxy | quote }}
            {{- end }}
            - --
            - {{ .Values.scan.target | quote }}
          env:
            - name: HOME
              value: /home/kagesec
            {{- if $secret }}
            {{- range $key := list "ANTHROPIC_API_KEY" "NVD_API_KEY" "KAGESEC_AUTH_BEARER" "KAGESEC_AUTH_COOKIE" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.job.resources | nindent 12 }}
          volumeMounts:
            - name: reports
              mountPath: {{ .Values.reports.mountPath }}
            # Writable scratch space — the root filesystem is read-only
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/kagesec
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: reports
          {{- if .Values.reports.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kagesec.fullname" . }}-reports
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi

name: KageSec DAST Scanner
description: AI-assisted DAST scan — finds OWASP Top 10 vulnerabilities in a running web app.
author: KageSec

branding:
  icon: shield
  color: red

inputs:
  target:
    description: Target URL to scan (e.g. https://staging.example.com). Only scan systems you are authorised to test.
    required: true
  api-key:
    description: Anthropic API key for AI verification (optional)
    required: false
    default: ""
  depth:
    description: Crawl depth
    required: false
    default: "3"
  max-pages:
    description: Maximum pages to crawl
    required: false
    default: "50"
  output:
    description: "Report format: json | markdown | sarif | all"
    required: false
    default: "sarif"
  fail-on:
    description: "Fail the step if findings at this severity or above exist: critical | high | medium | low | info. Empty = never fail."
    required: false
    default: "high"
  passive:
    description: "Passive mode — no injection payloads (safer for production)"
    required: false
    default: "false"
  modules:
    description: "Space-separated list of modules to run (default: all)"
    required: false
    default: ""
  exclude:
    description: "Space-separated URL glob patterns to skip (e.g. '*/logout* *.css')"
    required: false
    default: ""
  no-ai:
    description: "Disable AI verification (no API key needed, nothing sent to an AI provider)"
    required: false
    default: "false"
  browser:
    description: "Use the headless-browser crawler for JavaScript-heavy apps (adds ~1 minute to install Chromium)"
    required: false
    default: "true"
  report-dir:
    description: Directory to write reports into
    required: false
    default: "reports"

outputs:
  report-path:
    description: Path to the generated SARIF report (or JSON report when SARIF was not requested)
    value: ${{ steps.scan.outputs.report-path }}
  findings-count:
    description: Number of findings (excluding ones AI marked as false positives)
    value: ${{ steps.scan.outputs.findings-count }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ github.action_path }}/engine/go.mod
        cache: false

    - name: Build the template engine
      shell: bash
      working-directory: ${{ github.action_path }}/engine
      run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../scanner/_bin/kagesec-engine .

    - name: Install KageSec (from this action's own source, so versions always match)
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BROWSER: ${{ inputs.browser }}
      run: |
        if [ "$BROWSER" = "true" ]; then
          python -m pip install --quiet "${ACTION_PATH}[browser]"
          python -m playwright install --with-deps chromium
        else
          python -m pip install --quiet "${ACTION_PATH}"
        fi

    - name: Run KageSec
      id: scan
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        KAGESEC_PASSIVE: ${{ inputs.passive }}
        KAGESEC_NO_AI: ${{ inputs.no-ai }}
        KAGESEC_MODULES: ${{ inputs.modules }}
        KAGESEC_EXCLUDE: ${{ inputs.exclude }}
        TARGET: ${{ inputs.target }}
        DEPTH: ${{ inputs.depth }}
        MAX_PAGES: ${{ inputs.max-pages }}
        OUTPUT: ${{ inputs.output }}
        FAIL_ON: ${{ inputs.fail-on }}
        BROWSER: ${{ inputs.browser }}
        REPORT_DIR: ${{ inputs.report-dir }}
      run: |
        args=(scan --depth "$DEPTH" --max-pages "$MAX_PAGES" --output "$OUTPUT" --report-dir "$REPORT_DIR")
        [ -n "$FAIL_ON" ] && args+=(--fail-on "$FAIL_ON")
        [ "$BROWSER" = "true" ] || args+=(--no-browser)
        kagesec "${args[@]}" -- "$TARGET"

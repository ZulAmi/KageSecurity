name: KageSec DAST Scan

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: Target URL to scan
        required: true

jobs:
  dast-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to GitHub Security tab
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run KageSec DAST Scan
        id: kagesec
        uses: ./                           # use action.yml from this repo
        # From another repo, pin a release tag: uses: ZulAmi/KageSecurity@vX.Y.Z
        with:
          target: ${{ github.event.inputs.target || vars.STAGING_URL }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          output: sarif
          fail-on: high
          depth: "3"
          max-pages: "50"
          exclude: "*/logout* *.css *.js *.png *.jpg"

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.kagesec.outputs.report-path != ''
        with:
          sarif_file: ${{ steps.kagesec.outputs.report-path }}
          category: kagesec-dast
